<!DOCTYPE html>
<html lang="fr">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ma ville — Le Général</title>
<style>
  :root {
    --bg:#0B1420; --surface:#132234; --surface2:#1A2E44; --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.14);
    --text:#F0F4F8; --muted:#8FA3B8; --muted2:#5A6E82;
    --sand:#E8C170; --sea:#2E8FA3; --green:#3DA35D; --red:#D64545;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --r:16px; --r-sm:10px;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:var(--font); padding-bottom:40px; }
  .back-to-qg { color:var(--muted); text-decoration:none; font-size:12px; font-weight:600; }
  .header-bar { background:#0B1420; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
  .hero-photo { width:100%; height:180px; object-fit:cover; background:var(--surface); display:block; }
  .hero-title-wrap { padding:16px; background:linear-gradient(135deg,#0E2A3A,#0B1420); border-bottom:1px solid var(--border); }
  .hero-title { font-size:24px; font-weight:800; display:flex; align-items:center; gap:8px; }
  .hero-sub { font-size:12px; color:var(--muted); margin-top:4px; }
  .view { padding:16px; }
  .sec { font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:20px 0 8px; }
  .sec:first-child { margin-top:0; }
  .card { background:var(--surface); border-radius:var(--r); border:1px solid var(--border); padding:16px; margin-bottom:12px; }
  .loading { font-size:13px; color:var(--muted); padding:12px 0; }
  .meteo-row { display:flex; gap:8px; }
  .meteo-day { flex:1; background:var(--surface2); border-radius:var(--r-sm); padding:12px 6px; text-align:center; }
  .meteo-day-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
  .meteo-icon { font-size:26px; margin-bottom:4px; }
  .meteo-temps { font-size:13px; font-weight:700; }
  .meteo-temps .lo { color:var(--muted); font-weight:500; }
  .poi-row, .evt-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); }
  .poi-row:last-child, .evt-row:last-child { border-bottom:none; }
  .poi-name, .evt-name { font-size:13px; font-weight:700; }
  .poi-dist, .evt-date { font-size:11px; color:var(--muted); margin-top:1px; }
  .poi-link, .evt-link { color:var(--sea); text-decoration:none; font-size:11px; font-weight:700; flex-shrink:0; }
  .aqi-badge { display:inline-block; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:800; }
  .search-wrap { padding:14px 16px; background:var(--surface); border-bottom:1px solid var(--border); }
  .search-row { display:flex; gap:8px; }
  .search-input { flex:1; background:var(--bg); border:1px solid var(--border2); border-radius:var(--r-sm); padding:11px 14px; font-family:var(--font); font-size:14px; color:var(--text); }
  .search-input::placeholder { color:var(--muted2); }
  .search-btn { background:var(--sea); color:#fff; border:none; border-radius:var(--r-sm); padding:11px 16px; font-family:var(--font); font-size:13px; font-weight:700; cursor:pointer; }
  .search-results { margin-top:8px; }
  .search-item { display:flex; flex-direction:column; align-items:flex-start; width:100%; background:var(--bg); border:1px solid var(--border2); border-radius:var(--r-sm); padding:10px 14px; margin-bottom:6px; font-family:var(--font); cursor:pointer; text-align:left; }
  .search-item-name { font-size:13px; font-weight:700; color:var(--text); }
  .search-item-region { font-size:11px; color:var(--muted); }
</style>
</head>
<body>

<div class="header-bar">
  <a href="https://legeneral.org" class="back-to-qg">← Le Général</a>
  <div style="font-size:11px;color:var(--muted2);">Ma ville</div>
</div>

<div class="search-wrap">
  <div class="search-row">
    <input id="search-input" class="search-input" type="text" placeholder="Chercher une ville dans le monde...">
    <button id="search-btn" class="search-btn">Chercher</button>
  </div>
  <div id="search-results" class="search-results"></div>
</div>

<div id="hero-photo-wrap"></div>
<div class="hero-title-wrap">
  <div class="hero-title">📍 <span id="ville-nom">—</span></div>
  <div class="hero-sub" id="ville-coords">Chargement…</div>
</div>

<div class="view">

  <p class="sec">📖 À propos</p>
  <div class="card" id="topo-card"><div class="loading">…</div></div>

  <p class="sec">🌤 Météo — aujourd'hui, demain, après-demain</p>
  <div class="card" id="meteo-card"><div class="loading">…</div></div>

  <p class="sec">🌬 Qualité de l'air</p>
  <div class="card" id="aqi-card"><div class="loading">…</div></div>

  <p class="sec">🏛 Lieux à visiter à proximité</p>
  <div class="card" id="poi-card"><div class="loading">…</div></div>

  <p class="sec">🎉 Événements</p>
  <div class="card" id="events-card"><div class="loading">…</div></div>

</div>

<script>
const WMO_ICONS = {0:"☀️",1:"🌤",2:"⛅",3:"☁️",45:"🌫",48:"🌫",51:"🌦",53:"🌦",55:"🌧",61:"🌧",63:"🌧",65:"🌧",71:"🌨",73:"🌨",75:"❄️",80:"🌦",81:"🌧",82:"⛈",95:"⛈",96:"⛈",99:"⛈"};
const WMO_DESC = {0:"Ciel dégagé",1:"Peu nuageux",2:"Partiellement nuageux",3:"Couvert",45:"Brouillard",51:"Bruine légère",61:"Pluie légère",63:"Pluie",71:"Neige légère",80:"Averses",95:"Orage"};
const JOURS = ["Aujourd'hui","Demain","Après-demain"];
const STORAGE_KEY = "qg_maville_derniere";

let VILLE = null;

function setVille(v) {
  VILLE = v;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(v));
  document.getElementById("ville-nom").textContent = v.nom;
  document.getElementById("ville-coords").textContent =
    `${v.lat.toFixed(3)}°N, ${Math.abs(v.lon).toFixed(3)}°${v.lon<0?"O":"E"}${v.pays ? " · " + v.pays : ""}`;
  ["topo-card","meteo-card","aqi-card","poi-card","events-card"].forEach(id => {
    document.getElementById(id).innerHTML = '<div class="loading">Chargement…</div>';
  });
  loadTopo(); loadMeteo(); loadAQI(); loadPOI(); loadEvents();
}

let searchTimer;
document.getElementById("search-input").addEventListener("input", function() {
  clearTimeout(searchTimer);
  const q = this.value.trim();
  if (q.length < 2) { document.getElementById("search-results").innerHTML = ""; return; }
  searchTimer = setTimeout(() => searchCities(q), 350);
});
document.getElementById("search-btn").addEventListener("click", () => {
  const q = document.getElementById("search-input").value.trim();
  if (q.length >= 2) searchCities(q);
});

async function searchCities(query) {
  const resultsEl = document.getElementById("search-results");
  resultsEl.innerHTML = '<div style="padding:10px;color:var(--muted);font-size:13px;">Recherche…</div>';
  try {
    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=8&language=fr`);
    const data = await res.json();
    const cities = data.results || [];
    if (!cities.length) {
      resultsEl.innerHTML = '<div style="padding:10px;color:var(--muted);font-size:13px;">Aucun résultat</div>';
      return;
    }
    resultsEl.innerHTML = cities.map((c, i) => {
      const region = [c.admin1, c.country].filter(Boolean).join(", ");
      return `<button class="search-item" data-i="${i}">
        <span class="search-item-name">${c.name}</span>
        <span class="search-item-region">${region}</span>
      </button>`;
    }).join("");
    resultsEl.querySelectorAll(".search-item").forEach(btn => {
      btn.addEventListener("click", () => {
        const c = cities[+btn.dataset.i];
        setVille({ nom: c.name, lat: c.latitude, lon: c.longitude, pays: c.country });
        resultsEl.innerHTML = "";
        document.getElementById("search-input").value = "";
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
  } catch (e) {
    resultsEl.innerHTML = '<div style="padding:10px;color:var(--red);font-size:13px;">Erreur de recherche.</div>';
  }
}

async function fetchWikiSummary(nom, lang) {
  const res = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(nom)}`);
  if (!res.ok) return null;
  const data = await res.json();
  return data.extract ? data : null;
}
async function loadTopo() {
  const el = document.getElementById("topo-card");
  try {
    let data = await fetchWikiSummary(VILLE.nom, "fr");
    let lang = "fr";
    if (!data) { data = await fetchWikiSummary(VILLE.nom, "en"); lang = "en"; }
    if (data) {
      el.innerHTML = `<div style="font-size:13px;color:var(--text);line-height:1.7;">${data.extract}</div>
        <div style="margin-top:10px;display:flex;align-items:center;gap:8px;">
          <a href="${data.content_urls?.desktop?.page || '#'}" target="_blank" style="color:var(--sea);font-size:11px;font-weight:700;text-decoration:none;">Lire l'article complet →</a>
          ${lang==="en" ? '<span style="font-size:10px;color:var(--muted2);">(article en anglais, pas de version française trouvée)</span>' : ''}
        </div>`;
      const photo = data.originalimage?.source || data.thumbnail?.source;
      document.getElementById("hero-photo-wrap").innerHTML = photo ? `<img class="hero-photo" src="${photo}" alt="${VILLE.nom}">` : "";
    } else {
      el.innerHTML = `<div style="font-size:13px;color:var(--muted);">Aucun article Wikipédia trouvé pour "${VILLE.nom}".</div>`;
      document.getElementById("hero-photo-wrap").innerHTML = "";
    }
  } catch (e) {
    el.innerHTML = '<div style="font-size:13px;color:var(--red);">Erreur de chargement Wikipédia.</div>';
  }
}

async function loadMeteo() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${VILLE.lat}&longitude=${VILLE.lon}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=auto&forecast_days=3`;
    const res = await fetch(url);
    const data = await res.json();
    const d = data.daily;
    const html = '<div class="meteo-row">' + d.time.map((date, i) => `
      <div class="meteo-day">
        <div class="meteo-day-label">${JOURS[i] || date}</div>
        <div class="meteo-icon">${WMO_ICONS[d.weathercode[i]] || "🌡"}</div>
        <div class="meteo-temps">${Math.round(d.temperature_2m_max[i])}° <span class="lo">${Math.round(d.temperature_2m_min[i])}°</span></div>
      </div>`).join("") + `</div>
      <div style="font-size:11px;color:var(--muted);margin-top:10px;text-align:center;">${WMO_DESC[d.weathercode[0]] || ""} aujourd'hui</div>`;
    document.getElementById("meteo-card").innerHTML = html;
  } catch (e) {
    document.getElementById("meteo-card").innerHTML = '<div style="font-size:13px;color:var(--red);">Erreur de chargement météo.</div>';
  }
}

function aqiInfo(aqi) {
  if (aqi == null) return { label: "Inconnu", color: "var(--muted)" };
  if (aqi <= 20) return { label: "Très bon", color: "var(--green)" };
  if (aqi <= 40) return { label: "Bon", color: "var(--green)" };
  if (aqi <= 60) return { label: "Moyen", color: "var(--sand)" };
  if (aqi <= 80) return { label: "Dégradé", color: "#E08A3C" };
  if (aqi <= 100) return { label: "Mauvais", color: "var(--red)" };
  return { label: "Très mauvais", color: "var(--red)" };
}
async function loadAQI() {
  try {
    const url = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${VILLE.lat}&longitude=${VILLE.lon}&current=european_aqi,pm2_5,pm10`;
    const res = await fetch(url);
    const data = await res.json();
    const cur = data.current;
    const info = aqiInfo(cur.european_aqi);
    document.getElementById("aqi-card").innerHTML = `
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="aqi-badge" style="background:${info.color}22;color:${info.color};border:1px solid ${info.color}55;">Indice ${cur.european_aqi ?? "?"} — ${info.label}</span>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:10px;">PM2.5 : ${cur.pm2_5 ?? "?"} µg/m³ · PM10 : ${cur.pm10 ?? "?"} µg/m³</div>`;
  } catch (e) {
    document.getElementById("aqi-card").innerHTML = '<div style="font-size:13px;color:var(--red);">Erreur de chargement qualité de l\'air.</div>';
  }
}

function distLabel(m) {
  return m < 1000 ? `${Math.round(m)} m` : `${(m/1000).toFixed(1)} km`;
}
async function loadPOI() {
  try {
    const url = `https://fr.wikipedia.org/w/api.php?action=query&list=geosearch&gscoord=${VILLE.lat}|${VILLE.lon}&gsradius=10000&gslimit=12&format=json&origin=*`;
    const res = await fetch(url);
    const data = await res.json();
    const results = (data.query?.geosearch || []).filter(p => p.title !== VILLE.nom);
    if (!results.length) {
      document.getElementById("poi-card").innerHTML = '<div style="font-size:13px;color:var(--muted);">Aucun lieu trouvé à proximité.</div>';
      return;
    }
    document.getElementById("poi-card").innerHTML = results.slice(0, 10).map(p => `
      <div class="poi-row">
        <div style="flex:1;">
          <div class="poi-name">${p.title}</div>
          <div class="poi-dist">${distLabel(p.dist)}</div>
        </div>
        <a class="poi-link" href="https://fr.wikipedia.org/wiki/${encodeURIComponent(p.title.replace(/ /g,'_'))}" target="_blank">Voir →</a>
      </div>`).join("");
  } catch (e) {
    document.getElementById("poi-card").innerHTML = '<div style="font-size:13px;color:var(--red);">Erreur de recherche des lieux à visiter.</div>';
  }
}

async function loadEvents() {
  const el = document.getElementById("events-card");
  try {
    const url = `https://public.opendatasoft.com/api/explore/v2.1/catalog/datasets/evenements-publics-openagenda/records?where=distance(location_coordinates,geom%27POINT(${VILLE.lon}%20${VILLE.lat})%27,20km)&limit=8`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const events = data.results || [];
    if (!events.length) {
      el.innerHTML = `<div style="font-size:13px;color:var(--muted);line-height:1.6;">Aucun événement trouvé dans la base publique OpenAgenda pour cette zone (couverture variable selon les communes).<br><br>Demande une "mise à jour ${VILLE.nom}" pour que je cherche manuellement les événements à venir.</div>`;
      return;
    }
    el.innerHTML = events.map(e => `
      <div class="evt-row">
        <div style="flex:1;">
          <div class="evt-name">${e.title_fr || e.title || "Événement"}</div>
          <div class="evt-date">${e.firstdate_begin ? new Date(e.firstdate_begin).toLocaleDateString('fr-FR', {day:'numeric',month:'short'}) : ""}</div>
        </div>
        ${e.canonicalurl ? `<a class="evt-link" href="${e.canonicalurl}" target="_blank">Voir →</a>` : ""}
      </div>`).join("");
  } catch (e) {
    el.innerHTML = `<div style="font-size:13px;color:var(--muted);line-height:1.6;">Pas de source fiable et gratuite couvrant les événements de toutes les communes (base OpenAgenda inaccessible ou vide pour cette zone).<br><br>Demande une "mise à jour ${VILLE.nom}" pour que je cherche manuellement les événements à venir.</div>`;
  }
}

const saved = localStorage.getItem(STORAGE_KEY);
setVille(saved ? JSON.parse(saved) : { nom: "Quiberon", lat: 47.4844, lon: -3.1200, pays: "France" });
</script>

</body>
</html>
